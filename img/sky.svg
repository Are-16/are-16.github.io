<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f7fd8"/>
      <stop offset="36%" stop-color="#68b6f2"/>
      <stop offset="68%" stop-color="#b9e2ff"/>
      <stop offset="100%" stop-color="#f4fcff"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#fff8cf" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#fff8cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1470" cy="250" r="340" fill="url(#sunGlow)"/>
  <circle cx="1470" cy="250" r="76" fill="#fffdf0"/>

  <!-- faint high clouds -->
  <g fill="#ffffff" opacity="0.38" filter="url(#soft)">
    <ellipse cx="330" cy="270" rx="250" ry="52"/>
    <ellipse cx="520" cy="300" rx="180" ry="42"/>
    <ellipse cx="1180" cy="160" rx="280" ry="48"/>
  </g>

  <!-- cumulus clouds -->
  <g fill="#ffffff">
    <g opacity="0.95">
      <ellipse cx="430" cy="640" rx="250" ry="78"/>
      <ellipse cx="560" cy="590" rx="170" ry="92"/>
      <ellipse cx="300" cy="600" rx="150" ry="70"/>
      <ellipse cx="430" cy="560" rx="120" ry="84"/>
    </g>
    <g opacity="0.9">
      <ellipse cx="1520" cy="700" rx="270" ry="78"/>
      <ellipse cx="1660" cy="655" rx="160" ry="86"/>
      <ellipse cx="1370" cy="670" rx="140" ry="62"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="960" cy="840" rx="320" ry="62"/>
      <ellipse cx="1120" cy="805" rx="180" ry="68"/>
    </g>
  </g>

  <!-- cloud shadows -->
  <g fill="#c9e8ff" opacity="0.55" filter="url(#soft)">
    <ellipse cx="450" cy="700" rx="230" ry="42"/>
    <ellipse cx="1520" cy="752" rx="240" ry="38"/>
  </g>

  <!-- birds -->
  <g stroke="#4a6b82" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.65">
    <path d="M760 330 q18 -16 36 0 q18 -16 36 0"/>
    <path d="M872 296 q14 -12 28 0 q14 -12 28 0"/>
    <path d="M686 384 q12 -10 24 0 q12 -10 24 0"/>
    <path d="M820 380 q10 -8 20 0 q10 -8 20 0"/>
  </g>

  <!-- distant hills -->
  <path d="M0 982 Q240 898 480 958 T960 948 T1440 962 T1920 928 V1080 H0 Z" fill="#a9d9f5" opacity="0.55"/>
  <path d="M0 1022 Q320 958 640 1008 T1280 1002 T1920 982 V1080 H0 Z" fill="#7cc3ee" opacity="0.5"/>

  <!-- haze and light rays -->
  <rect y="760" width="1920" height="320" fill="url(#haze)"/>
  <g fill="#ffffff" opacity="0.14">
    <polygon points="1470,250 860,1080 1080,1080"/>
    <polygon points="1470,250 1660,1080 1860,1080"/>
  </g>

  <!-- lens sparkles -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="1240" cy="420" r="5"/>
    <circle cx="1160" cy="520" r="3"/>
    <circle cx="1650" cy="440" r="4"/>
  </g>
</svg>
